<!DOCTYPE html>
<html>
<head><title>Netlify Form Detection</title></head>
<body>
  <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quote" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="businessName" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="state" />
    <input type="text" name="statesOfOperation" />
    <input type="text" name="tradeType" />
    <input type="text" name="entityType" />
    <input type="number" name="numberOfFlaggers" />
    <input type="number" name="yearsInBusiness" />
    <input type="text" name="usesSubcontractors" />
    <input type="number" name="fullTimeEmployees" />
    <input type="number" name="partTimeEmployees" />
    <input type="text" name="streetAddress" />
    <input type="text" name="city" />
    <input type="text" name="zip" />
    <input type="text" name="fein" />
    <input type="text" name="yearBusinessStarted" />
    <input type="text" name="currentlyInsured" />
    <input type="text" name="currentCarrier" />
    <input type="text" name="priorPolicyNumber" />
    <input type="date" name="currentPolicyExpiration" />
    <textarea name="businessDescription"></textarea>
    <input type="date" name="desiredEffectiveDate" />
    <input type="text" name="requestedLimits" />
    <input type="checkbox" name="coverageTypes" />
    <input type="text" name="annualRevenue" />
    <input type="text" name="largestProjectValue" />
    <input type="text" name="lossesLast3Years" />
    <input type="number" name="lossCount" />
    <textarea name="lossDescription"></textarea>
    <textarea name="notes"></textarea>
  </form>
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <textarea name="message"></textarea>
  </form>
</body>
</html>
